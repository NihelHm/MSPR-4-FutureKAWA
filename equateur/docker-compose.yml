# ==========================================================
# DOCKER COMPOSE - FUTUREKAWA ÉQUATEUR
# Démarrage : docker compose up
# ==========================================================

services:

  db:
    image: postgres:15
    container_name: db_equateur
    restart: always
    environment:
      POSTGRES_DB:       bdd_equateur
      POSTGRES_USER:     user
      POSTGRES_PASSWORD: password
    ports:
      - "5435:5432"
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - db_equateur_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d bdd_equateur"]
      interval: 5s
      timeout: 5s
      retries: 10

  mqtt:
    image: eclipse-mosquitto:2
    container_name: mqtt_equateur
    restart: always
    ports:
      - "1885:1883"

  backend:
    build: .
    container_name: backend_equateur
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      COUNTRY_NAME: Équateur
      DB_HOST:      db
      DB_NAME:      bdd_equateur
      DB_USER:      user
      DB_PASSWORD:  password
      DB_PORT:      5432
    ports:
      - "8002:8000"

  consumer:
    build: .
    container_name: consumer_equateur
    restart: always
    depends_on:
      db:
        condition: service_healthy
      mqtt:
        condition: service_started
    environment:
      DB_HOST:    db
      DB_NAME:    bdd_equateur
      DB_USER:    user
      DB_PASSWORD: password
      DB_PORT:    5432
      MQTT_HOST:  mqtt
      MQTT_PORT:  1883
      MQTT_TOPIC: equateur/mesures
    command: ["python", "mqtt_consumer.py"]

  alerting:
    build: .
    container_name: alerting_equateur  # (ou colombie / equateur)
    restart: always
    dns:
      - 8.8.8.8
      - 8.8.4.4
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST:        db
      DB_NAME:        bdd_equateur      # (adapter par pays)
      DB_USER:        user
      DB_PASSWORD:    password
      DB_PORT:        5432
      CHECK_INTERVAL: 300
      SMTP_HOST:      sandbox.smtp.mailtrap.io
      SMTP_PORT:      587
      SMTP_USER:      0a516754fa9be9
      SMTP_PASSWORD:  d09cac0b66eff2
      MANAGER_EMAIL:  a.torres@futurekawa.com
    command: ["python", "alerting_engine.py"]

volumes:
  db_equateur_data:
